name: "main Branch CI: 5-Gate Pipeline"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate-1-compile-checkstyle:
    name: "Gate 1: Compile + Checkstyle"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew checkstyleMain compileJava

  gate-2-unit-archunit:
    name: "Gate 2: Unit + ArchUnit Tests"
    needs: gate-1-compile-checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :domain:test :application:test :boot:test

  gate-3-integration:
    name: "Gate 3: Integration Tests (Testcontainers)"
    needs: gate-2-unit-archunit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :adapter-persistence:test

  gate-4-mutation:
    name: "Gate 4: Mutation Testing (placeholder)"
    needs: gate-2-unit-archunit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
      # PIT is incompatible with Gradle 9.x; placeholder until plugin is updated
      - run: echo "PIT mutation testing skipped -- incompatible with Gradle 9.x"

  gate-5-security:
    name: "Gate 5: Security (placeholder)"
    needs: gate-1-compile-checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
      # OWASP dependency-check placeholder
      - run: echo "OWASP dependency-check placeholder -- to be configured"

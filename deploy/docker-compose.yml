
services:
  bot:
    container_name: kor-converter-bot
    image: kor-bot-spring:latest
    volumes:
      - ./cfg:/app/cfg
      - ./log:/app/log
    restart: always
    ports:
      - "8081:8081"
    networks:
      - converter_backend
    environment:
      TZ: "Asia/Seoul"
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_NAME: $DB_NAME
      DB_USER_NAME: $DB_USER_NAME
      DB_PASSWORD: $DB_PASSWORD
      DISCORD_BOT_TOKEN: $DISCORD_BOT_TOKEN
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_SAMPLING_PROBABILITY: ${OTEL_SAMPLING_PROBABILITY:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  converter_backend:
    external: true

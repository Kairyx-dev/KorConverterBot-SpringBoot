[versions]
# plugin
springframework-boot = "4.1.1"
spring-dependency-management = "1.1.7"
linecorp-build-recipe-plugin = "1.1.1"
com-googel-cloud-tools-jib = "3.5.4"
net-ltgt-errorprone = "5.1.0"
spotless = "8.8.0"
pitest-gradle = "1.19.0"
pitest-core = "1.23.0"
jooq = "3.19.36"
flyway = "12.11.0"

# libs
projectlombok-lombok = "1.18.46"
junit-bom = "6.1.3"
slf4j-api = "2.0.18"
mapstruct = "1.6.3"
dev8tion-jda = "6.5.0"
org-postgresql = "42.7.13"
assertJ = "3.27.7"
ch-qos-logback = "1.5.38"
jspecify = "1.0.0"
com-uber-nullaway = "0.13.7"
com-google-errorprone-core = "2.50.0"
testcontainers = "1.21.4"
archunit = "1.5.0"
checkstyle = "10.25.0"
palantir-java-format = "2.97.0"
jqwik = "1.10.1"
mockito = "5.23.0"
opentelemetry-instrumentation = "2.29.0-alpha"

[libraries]
springframework-boot-starter = { group = "org.springframework.boot", name = "spring-boot-starter" }
springframework-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
springframework-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
springframework-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
springframework-boot-starter-json = { group = "org.springframework.boot", name = "spring-boot-starter-json" }
springframework-boot-starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
springframework-boot-starter-jooq = { group = "org.springframework.boot", name = "spring-boot-starter-jooq" }
springframework-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
springframework-boot-starter-opentelemetry = { group = "org.springframework.boot", name = "spring-boot-starter-opentelemetry" }
springframework-boot-flyway = { group = "org.springframework.boot", name = "spring-boot-flyway" }
springframework-boot-autoconfigure = { group = "org.springframework.boot", name = "spring-boot-autoconfigure" }
springframework-tx = { group = "org.springframework", name = "spring-tx" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j-api" }
projectlombok-lombok = { group = "org.projectlombok", name = "lombok", version.ref = "projectlombok-lombok" }
h2database = { group = "com.h2database", name = "h2" }
mapstruct = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { group = "org.mapstruct", name = "mapstruct-processor", version.ref = "mapstruct" }
dev8tion-jda = { group = "net.dv8tion", name = "JDA", version.ref = "dev8tion-jda" }
org-postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "org-postgresql" }
assertj = { group = "org.assertj", name = "assertj-core", version.ref = "assertJ" }
com-google-errorprone-core = { group = "com.google.errorprone", name = "error_prone_core", version.ref = "com-google-errorprone-core" }
com-uber-nullaway = { group = "com.uber.nullaway", name = "nullaway", version.ref = "com-uber-nullaway" }

# Spotless 의 java 포맷터. 어느 모듈에도 의존성으로 추가하지 않으며, 루트 build.gradle.kts 의
# spotless 블록이 versions.palantir-java-format 만 문자열로 읽는다.
# 이 [libraries] 항목은 Dependabot 이 bump 대상 artifact 를 인식하게 하려고 존재한다.
palantir-java-format = { group = "com.palantir.javaformat", name = "palantir-java-format", version.ref = "palantir-java-format" }

# for domain
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit-bom" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }

org-jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }

ch-qos-logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "ch-qos-logback" }
ch-qos-logback-core = { group = "ch.qos.logback", name = "logback-core", version.ref = "ch-qos-logback" }

# jOOQ
jooq-core = { group = "org.jooq", name = "jooq", version.ref = "jooq" }
jooq-codegen = { group = "org.jooq", name = "jooq-codegen", version.ref = "jooq" }

# Flyway
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }

# OpenTelemetry Logback appender (bridges Logback log events to OTel LogRecord → OTLP → Loki)
opentelemetry-logback-appender = { group = "io.opentelemetry.instrumentation", name = "opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-instrumentation" }

# Testcontainers
testcontainers-bom = { group = "org.testcontainers", name = "testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { group = "org.testcontainers", name = "postgresql", version.ref = "testcontainers" }
testcontainers-junit = { group = "org.testcontainers", name = "junit-jupiter", version.ref = "testcontainers" }

# ArchUnit
archunit-junit5 = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archunit" }

# jqwik
jqwik = { group = "net.jqwik", name = "jqwik", version.ref = "jqwik" }

# Mockito
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
springframework-boot = { id = "org.springframework.boot", version.ref = "springframework-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
linecorp-build-recipe-plugin = { id = "com.linecorp.build-recipe-plugin", version.ref = "linecorp-build-recipe-plugin" }
com-google-cloud-tools-jib = { id = "com.google.cloud.tools.jib", version.ref = "com-googel-cloud-tools-jib" }
net-ltgt-errorprone = { id = "net.ltgt.errorprone", version.ref = "net-ltgt-errorprone" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-gradle" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }